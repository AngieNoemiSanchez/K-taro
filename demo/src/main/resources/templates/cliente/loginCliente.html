<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-TARO - Iniciar Sesión</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">

<div class="login-wrapper">
    <div class="logo-container">
        <img th:src="@{/images/LOGOKTARO_blanco.png}" alt="K-TARO Logo" class="login-logo">
    </div>

    <h1 class="login-title">La auténtica experiencia coreana</h1>

    <div th:if="${param.error}" class="alert-error">
        Usuario o contraseña incorrectos.
    </div>
    <div th:if="${param.locked}" class="alert-error"
         th:text="'Cuenta bloqueada por demasiados intentos fallidos. Intenta de nuevo en ' + ${param.locked[0]} + ' minuto(s).'">
    </div>
    <div th:if="${param.logout}" class="alert-success">
        Has cerrado sesión correctamente.
    </div>
    <div th:if="${success}" class="alert-success" th:text="${success}"></div>

    <form th:action="@{/login}" method="post" class="login-form">
        <div class="form-group">
            <label for="username">Usuario (correo electrónico):</label>
            <input type="email" id="username" name="username" required autofocus autocomplete="email">
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-primary">Ingresar</button>
    </form>

    <a th:href="@{/cliente/olvide}" class="forgot-password">Olvidaste tu contraseña?</a>

    <div class="divider-section">
        <p>No tienes una cuenta aún?</p>
        <a th:href="@{/cliente/registro}" class="btn-secondary">Registrarse con correo electrónico</a>
    </div>

</div>

</body>
</html>

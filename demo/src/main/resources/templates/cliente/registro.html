<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-TARO - Crear Cuenta</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">

<div class="login-wrapper">
    <div class="logo-container">
        <a th:href="@{/}">
            <img th:src="@{/images/LOGOKTARO_blanco.png}" alt="K-TARO Logo" class="login-logo">
        </a>
    </div>

    <h1 class="login-title">Crea tu cuenta en K-TARO</h1>

    <form th:action="@{/cliente/registro}" th:object="${registroForm}" method="post" class="login-form">

        <div th:if="${#fields.hasGlobalErrors()}" class="alert-error">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <div class="form-group">
            <label for="nombre">Nombres:</label>
            <input type="text" id="nombre" th:field="*{nombre}" maxlength="20" placeholder="Ej. Juan Carlos">
            <small class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>
        </div>

        <div class="form-group">
            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" th:field="*{apellidos}" maxlength="30" placeholder="Ej. Pérez Gómez">
            <small class="field-error" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></small>
        </div>

        <div class="form-group">
            <label for="dni">DNI:</label>
            <input type="text" id="dni" th:field="*{dni}" maxlength="8" inputmode="numeric" placeholder="Ej. 12345678">
            <small class="field-error" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></small>
        </div>

        <div class="form-group">
            <label for="fechaNacimiento">Fecha de nacimiento:</label>
            <input type="date" id="fechaNacimiento" th:field="*{fechaNacimiento}">
            <small class="field-error" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></small>
        </div>

        <div class="form-group">
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" th:field="*{telefono}" maxlength="9" inputmode="numeric" placeholder="Ej. 912345678">
            <small class="field-error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></small>
        </div>

        <div class="form-group">
            <label for="direccion">Dirección de entrega:</label>
            <input type="text" id="direccion" th:field="*{direccion}" maxlength="100" placeholder="Ej. Av. Principal 123, Apto 401">
            <small class="field-error" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></small>
        </div>

        <div class="form-group">
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" th:field="*{correo}" maxlength="50" placeholder="ejemplo@correo.com" autocomplete="email">
            <small class="field-error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></small>
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" th:field="*{password}" maxlength="30" autocomplete="new-password">
            <small class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
        </div>

        <button type="submit" class="btn-primary">Registrarse</button>
    </form>

    <div class="divider-section" style="margin-top: 20px;">
        <p>¿Ya tienes una cuenta?</p>
        <a th:href="@{/cliente/login}" class="btn-secondary">Iniciar sesión</a>
    </div>

</div>

</body>
</html>

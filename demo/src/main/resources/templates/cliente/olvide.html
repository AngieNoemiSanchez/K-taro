<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-TARO - Recuperar contraseña</title>
  <link rel="stylesheet" th:href="@{/css/login.css}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">

  <div class="login-wrapper">
    <div class="logo-container">
      <img th:src="@{/images/LOGOKTARO_blanco.png}" alt="K-TARO Logo" class="login-logo">
    </div>

    <h1 class="login-title">Recuperar contraseña</h1>

    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <form th:action="@{/cliente/olvide}" method="post" class="login-form">
      <div class="form-group">
        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" required autofocus autocomplete="email">
      </div>

      <button type="submit" class="btn-primary">Enviar enlace</button>
    </form>

    <a th:href="@{/cliente/login}" class="forgot-password">Volver a iniciar sesión</a>
  </div>

</body>
</html>

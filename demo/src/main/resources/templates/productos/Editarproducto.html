<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/inicio.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
  <title>Editar producto | K-TARO</title>
</head>
<body class="bg-white">

<header th:replace="~{fragments/admin-header :: adminHeader('catalogo')}"></header>

<main class="container py-5" style="max-width: 900px;">
  <h1 class="fw-bolder text-primary mb-1">EDITAR PRODUCTO</h1>
  <p class="h5 fw-bold text-soft mb-4">Edite el producto seleccionado</p>
  <div class="alert alert-success" role="status" th:if="${mensaje}" th:text="${mensaje}"></div>

  <div class="card border-0 shadow rounded-4">
    <div class="card-body p-4 p-md-5">
      <p class="h5 fw-bold text-primary mb-3">Datos del registro</p>
      <form th:replace="~{fragments/AdminCatalogoForm :: productForm(@{/admin/productos/{id}(id=${productId})}, 'Guardar cambios', 'Stock', false)}"></form>
    </div>
  </div>
</main>

<footer><div th:replace="~{fragments/footer :: siteFooter}"></div></footer>

<script th:src="@{/js/ts/admin-producto.js}" defer></script>
</body>
</html>

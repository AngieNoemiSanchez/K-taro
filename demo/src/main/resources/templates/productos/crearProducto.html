<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Estilos compartidos del Panel Administrativo -->
  <link rel="stylesheet" th:href="@{/css/admin-fragments.css}">

  <title>Crear producto | K-TARO</title>
</head>
<body>

  <!-- Header reutilizable del admin -->
  <div th:replace="~{fragments/admin-header :: adminHeader}"></div>

  <main class="container my-5">
    <p class="mb-0 fw-bold fs-3" style="color: #3929b5;">CREAR NUEVO PRODUCTO</p>
    <p class="fs-5" style="color: #6351e7;">Registra un nuevo producto</p>

    <div class="card shadow-sm border-0 mt-3">
      <div class="card-body p-4">
        <p class="fs-5 fw-bold" style="color: #3929b5;">
          Datos del nuevo registro
        </p>

        <form id="productForm" th:action="@{/admin/productos}" th:object="${productForm}" method="post" novalidate>
          <div class="row g-3">

            <div class="col-md-6">
              <label for="name" class="form-label" style="color: #6351e7;">Nombre del producto</label>
              <input type="text" id="name" th:field="*{name}" class="form-control"
                     th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" maxlength="100">
              <div class="invalid-feedback" th:errors="*{name}"></div>
            </div>

            <div class="col-md-6">
              <label for="category" class="form-label d-block" style="color: #6351e7;">Tipo de producto</label>
              <select id="category" th:field="*{category}" class="form-control form-select text-secondary"
                      th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
                <option value="">Selecciona...</option>
                <option value="snacks">Snack</option>
                <option value="ramen">Ramen</option>
                <option value="bebidas">Bebidas</option>
                <option value="otros">Otros</option>
              </select>
              <div class="invalid-feedback" th:errors="*{category}"></div>
            </div>

            <div class="col-12">
              <label for="description" class="form-label" style="color: #6351e7;">Descripción del producto</label>
              <textarea id="description" th:field="*{description}" class="form-control" rows="4" maxlength="500"
                        th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
              <div class="invalid-feedback" th:errors="*{description}"></div>
            </div>

            <div class="col-md-4">
              <label for="price" class="form-label" style="color: #6351e7;">Precio unidad</label>
              <input type="number" id="price" th:field="*{price}" class="form-control" min="0.01" step="0.01"
                     th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">
              <div class="invalid-feedback" th:errors="*{price}"></div>
            </div>

            <div class="col-md-4">
              <label for="stock" class="form-label" style="color: #6351e7;">Stock inicial</label>
              <input type="number" id="stock" th:field="*{stock}" class="form-control" min="0" step="1"
                     th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'">
              <div class="invalid-feedback" th:errors="*{stock}"></div>
            </div>

            <div class="col-md-4">
              <label for="active" class="form-label d-block" style="color: #6351e7;">Estado del producto</label>
              <select id="active" th:field="*{active}" class="form-control form-select text-secondary">
                <option value="true">Activo</option>
                <option value="false">Inactivo</option>
              </select>
            </div>

            <div class="col-12 mt-4">
              <button type="submit" class="btn text-white px-4 me-2" style="background-color: #3929b5;">Registrar</button>
              <a th:href="@{/admin/catalogo}" class="btn px-4" style="border: 1px solid #3929b5; color: #3929b5;">Cancelar</a>
            </div>

          </div>
        </form>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <script th:src="@{/js/ts/admin-producto.js}" defer></script>
</body>
</html>

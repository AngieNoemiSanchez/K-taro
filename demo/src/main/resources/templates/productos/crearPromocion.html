<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        crossorigin="anonymous">

  <title>Document</title>
</head>
<body>

<header>
  <div th:replace="~{fragments/header :: siteHeader}"></div>
</header>

<main>
  <div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="container">
      <p class="mb-0 fw-bold fs-3" style=" color: #3929b5;">CREAR NUEVA PROMOCIÓN</p>
      <p class="fs-5" style=" color: #6351e7;">Registra una nueva promoción</p>
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <p class="fs-5 fw-bold" style=" color: #3929b5;">
            Datos del nuevo registro
          </p>

          <form action="" class="form-group">
            <div class="row g-3 ">

              <div class="col">
                <label for="" class="form-label" style=" color: #6351e7;">Nombre de la promoción</label>
                <input type="text" class="form-control">
              </div>

              <div class="col">
                <label for="" class="form-label d-block" style=" color: #6351e7;">Tiempo de duración</label>
                <select name="" id="#" class="form-control form-select text-secondary">
                  <option value="">Siempre</option>
                  <option value="">Domingos</option>
                  <option value="">Miércoles</option>
                </select>
              </div>

              <div class="col-12">
                <label for="" class="form-label" style=" color: #6351e7;">Descripción de la promoción</label>
                <textarea name="" id="" class="form-control" rows="4"></textarea>
              </div>

              <p class="mb-0" style="color: #6351e7;">Contenido de la promoción</p>
              <div class="col-12">
                <table class="table">
                  <thead>
                  <tr>
                    <th scope="row" style=" color: #6351e7;">ID</th>
                    <th scope="row" style=" color: #6351e7;">Nombre del producto</th>
                    <th scope="row" style=" color: #6351e7;">Tipo</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr>
                    <td class="border-0">
                      <a href="" class="nav-link text-secondary">+Agregar producto</a>
                    </td>
                  </tr>
                  </tbody>
                </table>
              </div>

              <div class="col-4">
                <label for="" class="form-label" style=" color: #6351e7;">Precio promoción</label>
                <input type="number" class="form-control">
              </div>



              <div class="col-12">
                <button class="btn text-white w-25" style="background-color: #3929b5;">Registrar</button>
                <button class="btn w-25 " style="border: 1px solid #3929b5 ; color: #3929b5;">Cancelar</button>
              </div>

            </div>


          </form>
        </div>

      </div>
    </div>
  </div>
</main>

<footer>
  <div th:replace="~{fragments/footer :: siteFooter}"></div>
</footer>

</body>
</html>

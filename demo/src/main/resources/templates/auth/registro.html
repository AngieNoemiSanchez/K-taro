<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-TARO - Crear Cuenta</title>
    <!-- Reutilizamos la misma hoja de estilos del login -->
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">

    <div class="login-wrapper">
        <!-- Logo K-TARO -->
        <div class="logo-container">
            <a th:href="@{/}">
                <img th:src="@{/images/logo-ktaro.jpg}" alt="K-TARO Logo" class="login-logo">
            </a>
        </div>

        <!-- Eslogan / Título de Registro -->
        <h1 class="login-title">Crea tu cuenta en K-TARO</h1>

        <!-- Mensaje de error o éxito si se requiere -->
        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <!-- Formulario de Registro -->
        <form th:action="@{/registro}" method="post" class="login-form">
            
            <div class="form-group">
                <label for="firstName">Nombres:</label>
                <input type="text" id="firstName" name="firstName" required placeholder="Ej. Juan Carlos">
            </div>

            <div class="form-group">
                <label for="lastName">Apellidos:</label>
                <input type="text" id="lastName" name="lastName" required placeholder="Ej. Pérez Gómez">
            </div>

            <div class="form-group">
                <label for="phone">Teléfono:</label>
                <input type="tel" id="phone" name="phone" required placeholder="Ej. 912345678">
            </div>

            <div class="form-group">
                <label for="address">Dirección de entrega:</label>
                <input type="text" id="address" name="address" required placeholder="Ej. Av. Principal 123, Apto 401">
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn-primary">Registrarse</button>
        </form>

        <!-- Sección para volver al Login -->
        <div class="divider-section" style="margin-top: 20px;">
            <p>¿Ya tienes una cuenta?</p>
            <a th:href="@{/login}" class="btn-secondary">Iniciar sesión</a>
        </div>

        <!-- Botón Social / Google -->
        <div class="social-login-section">
            <p class="social-divider">O también</p>
            <button type="button" class="btn-google">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google Logo" class="google-icon">
                Registrarse con Google
            </button>
        </div>
    </div>

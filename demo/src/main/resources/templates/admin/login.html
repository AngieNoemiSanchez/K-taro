<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Administrador K-TARO</title>
    <link rel="stylesheet" th:href="@{/css/admin-login.css}">
</head>
<body>
<div class="login-card">
    <div class="logo-container">
        <img th:src="@{/images/LOGOKTARO.png}" alt="K-TARO Logo">
    </div>

    <div th:if="${param.error}" class="error-message">
        <p>Correo o contraseña incorrectos.</p>
    </div>
    <div th:if="${param.logout}" class="error-message">
        <p>Has cerrado sesión correctamente.</p>
    </div>

    <form th:action="@{/admin/login}" method="post">
        <div class="form-group">
            <label for="username">Correo</label>
            <input type="email" id="username" name="username" placeholder="Ingresa tu correo" required autocomplete="off">
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
        </div>

        <button type="submit" class="btn-submit">Ingresar</button>
    </form>
</div>
</body>
</html>

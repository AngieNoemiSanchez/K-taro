<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>K-TARO | Promociones</title>

  <link rel="stylesheet" th:href="@{/css/inicio.css}">
  <link rel="stylesheet" th:href="@{/css/promociones.css}">
  <link rel="stylesheet" th:href="@{/css/catalog-extra.css}">
</head>

<body>

<!-- Encabezado global -->
<div th:replace="~{fragments/header :: siteHeader}"></div>

<!-- Ruta de navegación -->
<div class="promo-breadcrumb">
  <div class="promo-breadcrumb-content">
    Inicio / Promociones
  </div>
</div>

<main class="promociones-container">

  <h1 class="promociones-title">PROMOCIONES</h1>

  <p class="promo-empty" th:if="${#lists.isEmpty(promotions)}">
    Por ahora no hay promociones disponibles. ¡Vuelve pronto!
  </p>

  <!-- Una tarjeta por promoción activa; la imagen subida en el admin es el fondo -->
  <section class="promo-banner" th:each="promo : ${promotions}"
           th:classappend="${promo.image() == null} ? 'promo-banner--noimg'"
           th:style="${promo.image() != null} ? |background-image: url('${promo.image()}')|">

    <div class="promo-banner-content">

      <span class="promo-duration" th:text="${promo.durationLabel()}">Siempre disponible</span>

      <h2 th:text="${promo.name()}">Nombre de la promoción</h2>

      <p th:text="${promo.description()}">Descripción de la promoción.</p>

      <ul class="promo-includes">
        <li th:each="productName : ${promo.productNames()}" th:text="${productName}">Producto</li>
      </ul>

      <div class="promo-banner-price">
        <del>S/ <span th:text="${promo.regularPrice().toPlainString()}">0.00</span></del>
        S/ <span th:text="${promo.price().toPlainString()}">0.00</span>
      </div>

      <button
              type="button"
              class="promo-add-btn promo-banner-btn add-to-cart"
              th:disabled="${!promo.inStock()}"
              th:attr="data-product-id=${promo.id()},data-product-name=${promo.name()},data-product-price=${promo.price()},data-product-stock=${promo.stock()},data-category='Promociones'"
              th:text="${promo.inStock()} ? 'Agregar al carrito' : 'Agotado'">
        Agregar al carrito
      </button>

    </div>

  </section>

</main>

<!-- Pie de página global -->
<div th:replace="~{fragments/footer :: siteFooter}"></div>

<!-- JavaScript del carrito -->
<script th:src="@{/js/ts/cart.js}"></script>

</body>
</html>

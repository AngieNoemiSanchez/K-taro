spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
server.port=8081
# ----------------------------------------
# CONFIGURACIÓN DE CONEXIÓN A SQL SERVER
# ----------------------------------------
# Cambia 'localhost', '1433' y 'ktaro_db' por tu servidor, puerto y nombre de base de datos real.
# 'trustServerCertificate=true' evita errores de conexión si no tienes un certificado SSL válido configurado en el servidor de base de datos.
spring.datasource.url=jdbc:sqlserver://localhost:8081;databaseName=KtaroDB;encrypt=true;trustServerCertificate=true;

# Credenciales de acceso
spring.datasource.username=sa
spring.datasource.password=1234server

# Driver de SQL Server
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ----------------------------------------
# CONFIGURACIÓN DE SPRING DATA JPA (Hibernate)
# ----------------------------------------
# Actualiza el esquema automáticamente (ideal para desarrollo)
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en la consola para depuración
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# (Opcional) En Spring Boot 3 / Hibernate 6 el dialecto se detecta automáticamente, 
# pero si es necesario puedes forzarlo:
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect